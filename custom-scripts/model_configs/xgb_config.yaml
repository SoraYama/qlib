# XGBoost 模型配置
model:
  class: XGBModel
  module_path: qlib.contrib.model.xgboost
  kwargs:
    # 基础参数
    objective: reg:squarederror
    eval_metric: rmse
    booster: gbtree
    tree_method: hist
    n_estimators: 1000

    # 学习参数
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    colsample_bylevel: 1.0
    colsample_bynode: 1.0

    # 正则化参数
    reg_alpha: 0.0
    reg_lambda: 1.0
    gamma: 0.0

    # 其他参数
    random_state: 42
    n_jobs: 20
    verbosity: 0

    # 早停参数
    early_stopping_rounds: 50

# 可调参数范围（用于超参数优化）
tunable_params:
  learning_rate: [0.01, 0.05, 0.1, 0.2]
  max_depth: [3, 5, 7, 9, 12]
  min_child_weight: [1, 3, 5, 7, 10]
  subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
  colsample_bytree: [0.6, 0.7, 0.8, 0.9, 1.0]
  reg_alpha: [0.0, 0.1, 1.0, 10.0]
  reg_lambda: [0.1, 1.0, 10.0, 100.0]
  gamma: [0.0, 0.1, 0.5, 1.0, 2.0]

# 模型描述
description: |
  XGBoost 极端梯度提升模型，在机器学习竞赛中表现优异。
  具有强大的特征选择能力和良好的泛化性能。
  适合处理复杂的非线性关系。

