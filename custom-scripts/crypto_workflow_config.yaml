qlib_init:
    provider_uri: "~/.qlib/qlib_data/crypto_data"
    region: cn
market: &market all
benchmark: &benchmark btcusdt
data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2025-10-15
    fit_start_time: 2024-01-01
    fit_end_time: 2024-08-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]  # 预测未来2日收益率
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 2  # 加密货币只有2个标的，全部持有
            n_drop: 0  # 不丢弃
    backtest:
        start_time: 2024-12-01
        end_time: 2025-10-13
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.001  # 加密货币交易手续费约0.1%
            close_cost: 0.001
            min_cost: 0
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2024-08-31]  # 训练集
                valid: [2024-09-01, 2024-11-30]  # 验证集
                test: [2024-12-01, 2025-10-13]   # 测试集
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 365  # 加密货币7x24交易，使用365天年化
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

